name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "ryan/**"
      - "feat/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22.19.0"
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run check:local-app

  https-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Check shell syntax
        run: bash -n local/scripts/install.sh local/scripts/subboost.sh test/integration/https-compose.sh
      - name: Validate HTTPS with real Docker and Caddy
        run: bash test/integration/https-compose.sh

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build production image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: local/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
